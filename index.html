<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Mother's Day!</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #ffe6f2 0%, #ffccdf 100%);
            font-family: 'Georgia', serif;
            color: #b30059;
            text-align: center;
        }
        
        .card {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 90%;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .from-text {
            font-size: 1.8rem;
            margin-top: 20px;
            font-style: italic;
            color: #d81b60;
        }

        .music-player {
            margin-top: 40px;
            background: white;
            padding: 15px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: inline-block;
        }

        .music-label {
            margin: 0 0 10px 0;
            font-size: 0.9rem;
            color: #666;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Happy Mother's Day, Mom! 💐</h1>
        <p class="from-text">With all my love,<br>— Paxton</p>
        
        <div class="music-player">
            <p class="music-label">🎶 Now Playing: Kanye West - Hey Mama</p>
            <!-- Ensure the audio file is in the same folder as this HTML file -->
            <audio controls autoplay loop>
                <source src="hey_mama.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>
    </div>

</body>
</html>
