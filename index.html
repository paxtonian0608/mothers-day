<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Mother's Day!</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 50px 20px;
            box-sizing: border-box;
            background: linear-gradient(135deg, #ffe6f2 0%, #ffccdf 100%);
            font-family: 'Georgia', serif;
            color: #b30059;
            text-align: center;
        }
        
        .card {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            max-width: 700px;
            width: 100%;
            box-sizing: border-box;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .from-text {
            font-size: 1.8rem;
            margin-top: 20px;
            font-style: italic;
            color: #d81b60;
        }

        .music-player {
            margin-top: 40px;
            background: white;
            padding: 15px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: inline-block;
        }

        .music-label {
            margin: 0 0 10px 0;
            font-size: 0.9rem;
            color: #666;
            font-family: sans-serif;
        }

        /* --- New Scrolling & Image Section Styles --- */
        
        .scroll-prompt {
            margin-top: 50px;
            font-family: sans-serif;
            color: #b30059;
            font-size: 1.1rem;
            text-transform: lowercase;
            letter-spacing: 1px;
        }

        .arrow {
            display: block;
            font-size: 2rem;
            margin-top: 5px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(10px); }
            60% { transform: translateY(5px); }
        }

        .personal-section {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 2px dashed #ffccdf;
        }

        .photo {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        .message-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-top: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            /* Matches the title font */
            font-family: 'Georgia', serif; 
            font-size: 1.3rem;
            line-height: 1.6;
            color: #800040;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Top Section: Title & Music -->
        <h1>Happy Mother's Day, Mom! 💐</h1>
        <p class="from-text">With all my love,<br>— Paxton</p>
        
        <div class="music-player">
            <p class="music-label">🎶 Now Playing: Kanye West - Hey Mama</p>
            <audio controls autoplay loop>
                <source src="hey_mama.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>

        <!-- Scroll Indicator -->
        <div class="scroll-prompt">
            <p>scroll down</p>
            <span class="arrow">↓</span>
        </div>

        <!-- Bottom Section: Image & Personal Message -->
        <div class="personal-section">
            <!-- Image tag set with your specific dimensions, but CSS ensures it scales properly -->
            <img src="image1.png" alt="Me and Mom" width="2304" height="1728" class="photo">
            
            <div class="message-box">
                Dear Mom,<br><br>
               Thank you for being with me all my life and taking care of me. I hope you have a good mothers day and I hope you know that I love you very much!<br><br>
                Love,<br>
                Paxton
            </div>
        </div>
    </div>

</body>
</html>
